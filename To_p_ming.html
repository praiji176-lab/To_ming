<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 23rd Birthday พี่หมิง 🎂💖</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Mali (น่ารักละมุน) & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Mali:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Tone.js สำหรับเสียงเอฟเฟกต์น่ารักๆ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti สำหรับเอฟเฟกต์พลุและกระดาษสี -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --pink-light: #fff0f6;
            --pink-soft: #ffdeeb;
            --pink-pastel: #faa2c1;
            --pink-main: #f06595;
            --pink-dark: #d6336c;
        }

        body {
            font-family: 'Mali', 'Kanit', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe3ec 50%, #ffd8e8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #4a2535;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* พื้นหลังหัวใจลอยละมุนๆ */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* แอนิเมชันการเปลี่ยนด่าน */
        .stage-card {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* แอนิเมชันสั่นเมื่อตอบผิด */
        .shake {
            animation: shakeAnim 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* --- ด่านที่ 1: ซองจดหมาย 3D --- */
        .envelope-wrapper {
            position: relative;
            width: 290px;
            height: 195px;
            margin: 40px auto 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px);
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f783ac;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(240, 101, 149, 0.25);
        }

        .letter-paper {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 12px;
            height: 170px;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.1s;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ffc9c9;
        }

        .envelope-wrapper.open .letter-paper {
            transform: translateY(-95px);
            z-index: 5;
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 145px solid #ff87b2;
            border-right: 145px solid #ff9ec0;
            border-bottom: 105px solid #faa2c1;
            border-top: 90px solid transparent;
            border-radius: 0 0 16px 16px;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 145px solid transparent;
            border-right: 145px solid transparent;
            border-top: 112px solid #f06595;
            border-radius: 16px 16px 0 0;
            transform-origin: top;
            transition: transform 0.6s ease, z-index 0.2s;
            z-index: 4;
            pointer-events: none;
        }

        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .heart-seal {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            background: #fff0f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(214, 51, 108, 0.3);
            z-index: 5;
            transition: all 0.4s ease;
            animation: pulseHeart 1.5s infinite;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0);
        }

        @keyframes pulseHeart {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.12); }
        }

        /* --- ด่านที่ 3: แชท --- */
        .chat-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #fcc2d7;
            border-radius: 10px;
        }
        .typing-dot {
            animation: typingBlink 1.4s infinite both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBlink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* --- ด่านที่ 7: เค้กวันเกิดและเปลวเทียน --- */
        .flame {
            animation: flicker 0.6s infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
            50% { transform: scale(1.08) rotate(2deg); opacity: 1; }
            100% { transform: scale(0.95) rotate(-1deg); opacity: 0.9; }
        }

        .smoke {
            animation: smokeRise 1.8s ease-out forwards;
        }

        @keyframes smokeRise {
            0% { opacity: 0.8; transform: translateY(0) scale(0.6); }
            100% { opacity: 0; transform: translateY(-45px) scale(1.8); }
        }

        /* ปุ่มสไตล์น่ารัก */
        .btn-cute {
            background: linear-gradient(135deg, #f783ac 0%, #f06595 100%);
            color: white;
            box-shadow: 0 6px 18px rgba(240, 101, 149, 0.35);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-cute:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 22px rgba(240, 101, 149, 0.45);
        }
        .btn-cute:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <!-- พื้นหลังหัวใจและประกายวิบวับ -->
    <div id="floating-bg" class="floating-bg"></div>

    <!-- แถบด้านบน: ตัวบอกด่านและปุ่มเปิด/ปิดเสียง -->
    <header class="w-full max-w-md flex items-center justify-between mb-4 z-10 bg-white/75 backdrop-blur-md px-4 py-2.5 rounded-full shadow-sm border border-pink-100">
        <div class="flex items-center gap-2">
            <span class="text-lg">🐰</span>
            <span id="stage-indicator" class="text-sm font-semibold text-pink-600">ด่านที่ 1 / 7</span>
        </div>
        
        <!-- Progress bar เล็กๆ -->
        <div class="flex-1 mx-3 bg-pink-100 h-2 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-pink-400 to-rose-500 h-full rounded-full transition-all duration-500" style="width: 14.28%"></div>
        </div>

        <button id="sound-toggle" onclick="toggleSound()" class="flex items-center gap-1 text-xs font-medium bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-full border border-pink-200 transition">
            <span id="sound-icon">🔊</span>
            <span id="sound-text">เสียง: เปิด</span>
        </button>
    </header>

    <!-- กล่องแสดงเนื้อหาหลักของแต่ละด่าน -->
    <main id="app-container" class="w-full max-w-md z-10">
        <!-- เนื้อหาจะถูก Render ด้วย JavaScript -->
    </main>

    <!-- กล่องแจ้งเตือนแบบน่ารัก (แทน alert) -->
    <div id="toast-box" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform translate-y-4">
        <div id="toast-content" class="bg-white/95 backdrop-blur-md text-pink-600 font-medium px-5 py-3 rounded-2xl shadow-xl border-2 border-pink-200 flex items-center gap-2 text-sm whitespace-nowrap">
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ระบบเสียงเอฟเฟกต์ด้วย Tone.js (ไม่ต้องใช้ไฟล์เสียงภายนอก)
        // ==========================================
        let soundEnabled = true;
        let synth = null;

        async function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                await Tone.start();
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.15, sustain: 0.1, release: 0.4 }
                }).toDestination();
                synth.volume.value = -8;
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio().then(() => {
                if (!synth) return;
                const now = Tone.now();
                switch (type) {
                    case 'pop':
                        synth.triggerAttackRelease("C5", "16n", now);
                        break;
                    case 'tap':
                        synth.triggerAttackRelease("G5", "32n", now);
                        break;
                    case 'success':
                        synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                        synth.triggerAttackRelease("C6", "4n", now + 0.15);
                        break;
                    case 'error':
                        synth.triggerAttackRelease("Eb3", "16n", now);
                        synth.triggerAttackRelease("C3", "8n", now + 0.1);
                        break;
                    case 'open':
                        synth.triggerAttackRelease("E5", "16n", now);
                        synth.triggerAttackRelease("G5", "16n", now + 0.08);
                        synth.triggerAttackRelease("B5", "8n", now + 0.16);
                        break;
                    case 'celebrate':
                        const notes = ["C5", "E5", "G5", "C6", "E6", "G6"];
                        notes.forEach((n, i) => synth.triggerAttackRelease(n, "8n", now + i * 0.08));
                        break;
                }
            }).catch(() => {});
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('sound-text').textContent = soundEnabled ? 'เสียง: เปิด' : 'เสียง: ปิด';
            if (soundEnabled) playSound('pop');
        }

        // ==========================================
        // 2. เอฟเฟกต์หัวใจลอยและแจ้งเตือน Toast
        // ==========================================
        function createFloatingHearts() {
            const container = document.getElementById('floating-bg');
            const icons = ['💖', '🌸', '✨', '💕', '🐰', '🎀', '💗'];
            for (let i = 0; i < 18; i++) {
                const el = document.createElement('div');
                el.className = 'floating-item';
                el.textContent = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 14 + 14) + 'px';
                el.style.animationDuration = (Math.random() * 8 + 7) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(el);
            }
        }

        let toastTimeout;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            const content = document.getElementById('toast-content');
            content.innerHTML = msg;
            box.classList.remove('opacity-0', 'translate-y-4');
            box.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.add('opacity-0', 'translate-y-4');
                box.classList.remove('opacity-100', 'translate-y-0');
            }, 2400);
        }

        // ==========================================
        // 3. สถานะของแอปและตัวจัดการด่านต่างๆ
        // ==========================================
        let currentStage = 1;
        let passcodeInput = "";
        let openEndedAnswer = "";

        function goToStage(stageNum) {
            playSound('pop');
            currentStage = stageNum;
            document.getElementById('stage-indicator').textContent = `ด่านที่ ${currentStage} / 7`;
            document.getElementById('progress-bar').style.width = `${(currentStage / 7) * 100}%`;
            renderStage();
        }

        function renderStage() {
            const container = document.getElementById('app-container');
            switch (currentStage) {
                case 1: renderStage1(container); break;
                case 2: renderStage2(container); break;
                case 3: renderStage3(container); break;
                case 4: renderStage4(container); break;
                case 5: renderStage5(container); break;
                case 6: renderStage6(container); break;
                case 7: renderStage7(container); break;
            }
        }

        // ------------------------------------------
        // ด่านที่ 1: ซองจดหมายสีชมพูสุดน่ารัก
        // ------------------------------------------
        function renderStage1(container) {
            container.innerHTML = `
                <div class="stage-card bg-white/85 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border-2 border-pink-100 text-center">
                    <div class="inline-block bg-pink-100 text-pink-600 text-xs font-semibold px-3.5 py-1 rounded-full mb-2">
                        💌 Special Delivery
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pink-600 mb-1">มีจดหมายส่งถึงพี่หมิงค่ะ</h1>
                    <p class="text-sm text-pink-400 mb-6">แตะที่หัวใจบนซองจดหมายเพื่อเปิดดูนะ</p>

                    <div id="envelope" class="envelope-wrapper" onclick="openEnvelope()">
                        <div class="envelope-back"></div>
                        <div class="letter-paper">
                            <span class="text-2xl mb-1">🐰💕</span>
                            <p class="text-base sm:text-lg font-bold text-pink-600 leading-snug">
                                "มีอะไรจะบอกด้วยแหละ"
                            </p>
                            <span class="text-xs text-pink-400 mt-1">กดปุ่มด้านล่างเพื่อไปต่อเลย~</span>
                        </div>
                        <div class="envelope-front"></div>
                        <div class="envelope-flap"></div>
                        <div class="heart-seal">💖</div>
                    </div>

                    <div id="stage1-next" class="mt-8 opacity-0 pointer-events-none transition-all duration-500 transform translate-y-3">
                        <button onclick="goToStage(2)" class="btn-cute w-full py-3.5 rounded-2xl font-bold text-base flex items-center justify-center gap-2">
                            <span>เปิดอ่านต่อเลย</span>
                            <span>✨</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function openEnvelope() {
            const env = document.getElementById('envelope');
            if (!env.classList.contains('open')) {
                playSound('open');
                env.classList.add('open');
                setTimeout(() => {
                    const nextBtn = document.getElementById('stage1-next');
                    nextBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
                }, 550);
            }
        }

        // ------------------------------------------
        // ด่านที่ 2: ด่านรหัสลับ (010169 / คำใบ้ 13:32)
        // ------------------------------------------
        function renderStage2(container) {
            passcodeInput = "";
            container.innerHTML = `
                <div id="passcode-card" class="stage-card bg-white/85 backdrop-blur-md rounded-3xl p-6 sm:p-7 shadow-xl border-2 border-pink-100 text-center">
                    <div class="w-14 h-14 bg-pink-100 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                        🔐
                    </div>
                    <h2 class="text-xl font-bold text-pink-600 mb-1">ใส่รหัสลับปลดล็อก</h2>
                    <div class="inline-flex items-center gap-1.5 bg-rose-50 border border-rose-200 text-rose-500 text-sm font-semibold px-4 py-1.5 rounded-full mb-5">
                        <span>💡</span>
                        <span>คำใบ้: 13:32</span>
                    </div>

                    <!-- ช่องแสดงรหัส 6 หลัก -->
                    <div class="flex justify-center gap-2 sm:gap-2.5 mb-6" id="pin-display">
                        ${Array(6).fill(0).map((_, i) => `
                            <div id="pin-box-${i}" class="w-10 h-12 sm:w-11 sm:h-13 rounded-xl border-2 border-pink-200 bg-pink-50/70 flex items-center justify-center text-xl font-bold text-pink-600 transition-all">
                                •
                            </div>
                        `).join('')}
                    </div>

                    <!-- แป้นตัวเลข -->
                    <div class="grid grid-cols-3 gap-2.5 max-w-[260px] mx-auto">
                        ${[1,2,3,4,5,6,7,8,9].map(num => `
                            <button onclick="pressKey('${num}')" class="h-13 py-3 rounded-2xl bg-white hover:bg-pink-50 active:bg-pink-100 border border-pink-100 shadow-sm text-lg font-bold text-pink-600 transition transform active:scale-95">
                                ${num}
                            </button>
                        `).join('')}
                        <button onclick="clearPin()" class="py-3 rounded-2xl bg-pink-50 hover:bg-pink-100 text-xs font-semibold text-pink-500 transition active:scale-95">
                            ล้าง
                        </button>
                        <button onclick="pressKey('0')" class="py-3 rounded-2xl bg-white hover:bg-pink-50 active:bg-pink-100 border border-pink-100 shadow-sm text-lg font-bold text-pink-600 transition transform active:scale-95">
                            0
                        </button>
                        <button onclick="deletePin()" class="py-3 rounded-2xl bg-pink-50 hover:bg-pink-100 text-base font-bold text-pink-500 transition active:scale-95">
                            ⌫
                        </button>
                    </div>
                </div>
            `;
        }

        function updatePinUI() {
            for (let i = 0; i < 6; i++) {
                const box = document.getElementById(`pin-box-${i}`);
                if (i < passcodeInput.length) {
                    box.textContent = passcodeInput[i];
                    box.classList.add('border-pink-500', 'bg-white', 'scale-105');
                } else {
                    box.textContent = '•';
                    box.classList.remove('border-pink-500', 'bg-white', 'scale-105');
                }
            }
        }

        function pressKey(num) {
            if (passcodeInput.length >= 6) return;
            playSound('tap');
            passcodeInput += num;
            updatePinUI();

            if (passcodeInput.length === 6) {
                setTimeout(checkPasscode, 220);
            }
        }

        function deletePin() {
            if (passcodeInput.length > 0) {
                playSound('tap');
                passcodeInput = passcodeInput.slice(0, -1);
                updatePinUI();
            }
        }

        function clearPin() {
            playSound('tap');
            passcodeInput = "";
            updatePinUI();
        }

        function checkPasscode() {
            if (passcodeInput === "010169") {
                playSound('success');
                showToast('🎉 เย้! รหัสถูกต้อง เก่งมากเลยค่ะ');
                setTimeout(() => goToStage(3), 900);
            } else {
                playSound('error');
                const card = document.getElementById('passcode-card');
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                showToast('🥺 อุ๊ย รหัสยังไม่ถูกน้า ลองดูคำใบ้อีกทีสิ');
                setTimeout(() => {
                    passcodeInput = "";
                    updatePinUI();
                }, 400);
            }
        }

        // ------------------------------------------
        // ด่านที่ 3: แชทจำลองให้เลือกตอบ
        // ------------------------------------------
        let chatStep = 0;

        function renderStage3(container) {
            chatStep = 0;
            container.innerHTML = `
                <div class="stage-card bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border-2 border-pink-100 overflow-hidden flex flex-col h-[520px]">
                    <!-- หัวแชท -->
                    <div class="bg-gradient-to-r from-pink-400 to-rose-400 text-white px-4 py-3.5 flex items-center gap-3 shadow-sm">
                        <div class="relative">
                            <div class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-2xl shadow-sm border-2 border-pink-200">
                                🐰
                            </div>
                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-400 border-2 border-white rounded-full"></span>
                        </div>
                        <div class="text-left flex-1 min-w-0">
                            <h3 class="font-bold text-sm sm:text-base truncate">、เขาเรียกหนูว่าคุณกาตุ่ย  𐙚 ˖ི</h3>
                            <p class="text-xs text-pink-100 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 inline-block"></span>
                                กำลังใช้งานอยู่
                            </p>
                        </div>
                    </div>

                    <!-- พื้นที่ข้อความแชท -->
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-3 bg-pink-50/40">
                    </div>

                    <div id="blow-btn-wrapper" class="mb-4">
                        <button onclick="blowCandle()" class="btn-cute px-8 py-3 rounded-full font-bold text-base inline-flex items-center gap-2 animate-bounce">
                            <span>เป่าเทียน 🎂</span>
                        </button>
                    </div>

                    <!-- การ์ดคำอวยพร (แสดงหลังจากเป่าเทียนแล้ว) -->
                    <div id="birthday-wish-card" class="hidden text-left bg-gradient-to-br from-pink-50 via-white to-rose-50 border-2 border-pink-200 rounded-2xl p-4 sm:p-5 shadow-inner mb-4 animate-[popIn_0.6s_ease]">
                        <div class="flex items-center gap-2 mb-2 text-pink-600 font-bold text-sm">
                            <span>💌</span>
                            <span>ถึงพี่หมิงคนเก่งของหนู...</span>
                        </div>
                        <p class="text-gray-700 text-sm sm:text-[15px] leading-relaxed font-medium">
                            Happy birthday 🎂🎉 นะคะพี่หมิง อายุ 23 แล้ว ขอให้มีความสุขถึงเราจะเป็นประสาทกันบ่อย แต่อยากให้พี่ คนรอบข้าง หรืออะไรๆรอบกายเป็นความสุขให้พี่ มีแต่คนหวังดีนะคะ หนูไม่มีของจะให้เลย ยังไม่มีตัง แต่ถ้ามีตังเมื่อไหร่อยากซื้อให้ และจะซื้อให้แน่นอน ให้พี่ปลอดภัยในทุกภารกิจ สุขภาพแข็งแรงๆ แล้วค่อยมากินเค้กเป่าเทียนวันเกิดด้วยกัน ตอนที่พี่ได้ลาแล้วได้มาหาหนู รักพี่นะคะ
                        </p>
                    </div>

                    <!-- ปุ่มจุดพลุเพิ่ม & เล่นอีกครั้ง -->
                    <div id="celebrate-controls" class="hidden flex flex-col sm:flex-row gap-2.5">
                        <button onclick="launchFireworks()" class="btn-cute flex-1 py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-1.5">
                            <span>จุดพลุฉลองอีก!</span>
                            <span>🎆🎉</span>
                        </button>
                        <button onclick="goToStage(1)" class="py-3 px-4 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold text-sm transition">
                            เล่นใหม่อีกครั้ง ↺
                        </button>
                    </div>
                </div>
            `;
        }

        function blowCandle() {
            if (candleBlown) return;
            candleBlown = true;
            playSound('celebrate');

            // ดับไฟเทียนและแสดงควัน
            document.getElementById('candle-flames').classList.add('hidden');
            document.getElementById('candle-smoke').classList.remove('hidden');
            document.getElementById('blow-btn-wrapper').classList.add('hidden');
            document.getElementById('cake-instruction').textContent = "เย้! สุขสันต์วันเกิดนะคะพี่หมิง 💖✨";

            // แสดงการ์ดอวยพรและปุ่มควบคุม
            document.getElementById('birthday-wish-card').classList.remove('hidden');
            document.getElementById('celebrate-controls').classList.remove('hidden');

            // จุดพลุฉลองเต็มหน้าจอ
            launchFireworks();
        }

        function launchFireworks() {
            playSound('celebrate');
            if (typeof confetti !== 'function') return;

            const duration = 2800;
            const end = Date.now() + duration;
            const colors = ['#ff6b6b', '#f06595', '#faa2c1', '#ffd43b', '#ffffff'];

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 65,
                    origin: { x: 0, y: 0.7 },
                    colors: colors
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 65,
                    origin: { x: 1, y: 0.7 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            // พลุระเบิดตรงกลาง
            confetti({
                particleCount: 80,
                spread: 100,
                origin: { y: 0.55 },
                colors: colors
            });
        }

        // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            createFloatingHearts();
            renderStage();
        };
    </script>
</body>
</html>
